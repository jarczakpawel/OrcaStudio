name: Build macOS with Slicer Linux runtime

on:
  workflow_call:
  workflow_dispatch:

jobs:
  prepare_linux_auth_browser_arm64:
    name: Build native Linux arm64 auth browser
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: 'false'

      - name: Install native arm64 browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build file \
            libgtk-3-dev libwebkit2gtk-4.1-dev xvfb

      - name: Build and test native arm64 browser
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tools/slicer_linux_auth_helper -B build-auth-browser-arm64 -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-auth-browser-arm64 --parallel
          browser="$GITHUB_WORKSPACE/build-auth-browser-arm64/slicer_linux_auth_browser"
          test -x "$browser"
          file "$browser" | grep -Eq 'ELF 64-bit.*(ARM aarch64|aarch64)'
          "$browser" --probe
          xvfb-run -a "$browser" --self-test
          cp "$browser" "$GITHUB_WORKSPACE/slicer_linux_auth_browser_aarch64"


      - name: Upload native arm64 browser
        uses: actions/upload-artifact@v7
        with:
          name: linux_auth_browser_arm64_${{ github.sha }}
          path: ${{ github.workspace }}/slicer_linux_auth_browser_aarch64
          if-no-files-found: error

  prepare_slicer_linux_runtime:
    name: Prepare Slicer Linux runtime
    runs-on: ubuntu-24.04
    needs: prepare_linux_auth_browser_arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: 'false'

      - name: Download native arm64 browser
        uses: actions/download-artifact@v8
        with:
          name: linux_auth_browser_arm64_${{ github.sha }}
          path: ${{ runner.temp }}/linux-auth-browser-arm64

      - name: Normalize script permissions
        shell: bash
        run: |
          set -euo pipefail
          find "$GITHUB_WORKSPACE" -type f \( -name "*.sh" -o -name "*.command" \) -exec chmod +x {} +
          chmod +x "$GITHUB_WORKSPACE/build_release_macos.sh"
          chmod +x "$GITHUB_WORKSPACE/build_linux.sh"


      - name: Verify Linux runtime transport logic
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/slicer_linux_runtime/verify_full_linux_transport.py
          python3 tools/slicer_linux_runtime/test_runtime_dispatcher.py
          python3 tools/slicer_linux_runtime/test_macos_runtime_wrapper.py
          SLICER_LINUX_RUNTIME_ROSETTA_SPLITLOCK_CC=gcc-14 \
            python3 tools/slicer_linux_runtime/test_rosetta_splitlock_compat.py

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.3.0"
          useLocalCache: true
          useCloudCache: true

      - name: Apt-Install Dependencies
        uses: ./.github/actions/apt-install-deps

      - name: Install Linux auth browser build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus-x11 libasound2t64 libgtk-3-dev libpulse0 libwebkit2gtk-4.1-dev novnc openssl websockify x11vnc xvfb


      - name: Build Linux deps
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Build Linux deps attempt $attempt"
            if ./build_linux.sh -drlL; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Transient dependency download/build failure, retrying after backoff"
              sleep $((attempt * 20))
            fi
          done
          exit 1

      - name: Configure Slicer Linux runtime host build
        shell: bash
        run: |
          cmake -S . -B build -G "Ninja Multi-Config" -DORCA_TOOLS=ON -DBBL_RELEASE_TO_PUBLIC=1 -DBBL_INTERNAL_TESTING=0

      - name: Build linux host runtime
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Release --target slicer_linux_runtime_host
          arm_browser="$RUNNER_TEMP/linux-auth-browser-arm64/slicer_linux_auth_browser_aarch64"
          test -x "$arm_browser" || chmod +x "$arm_browser"
          SLICER_LINUX_RUNTIME_INCLUDE_ROSETTA_SPLITLOCK_COMPAT=1 \
          SLICER_LINUX_RUNTIME_ROSETTA_SPLITLOCK_CC=gcc-14 \
          SLICER_LINUX_AUTH_BROWSER_AARCH64="$arm_browser" \
            bash tools/slicer_linux_runtime_host/package_linux_host_runtime.sh build
          (cd tools/slicer_linux_runtime_host/runtime/linux-x86_64 && sha256sum -c runtime-files.sha256)
          tar -czvf linux_host_runtime_${{ github.sha }}.tar.gz -C tools/slicer_linux_runtime_host/runtime linux-x86_64

      - name: Upload linux host runtime artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux_host_runtime_macos_${{ github.sha }}
          path: ./linux_host_runtime_${{ github.sha }}.tar.gz
          if-no-files-found: error

  build_macos_arm64:
    name: Build macOS arm64
    runs-on: macos-15
    needs: prepare_slicer_linux_runtime
    env:
      ORCA_UPDATER_SIG_KEY: ${{ secrets.ORCA_UPDATER_SIG_KEY }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CERTIFICATE_ID }}
      APPLE_DEV_ACCOUNT: ${{ secrets.APPLE_DEV_ACCOUNT }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      APP_PWD: ${{ secrets.APP_PWD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: 'false'

      - name: Normalize script permissions
        shell: bash
        run: |
          set -euo pipefail
          find "$GITHUB_WORKSPACE" -type f \( -name "*.sh" -o -name "*.command" \) -exec chmod +x {} +
          chmod +x "$GITHUB_WORKSPACE/build_release_macos.sh"
          chmod +x "$GITHUB_WORKSPACE/build_linux.sh"


      - name: Verify macOS packaging invariants
        shell: bash
        run: |
          set -euo pipefail
          bash -n build_release_macos.sh

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.3.0"
          useLocalCache: true
          useCloudCache: true

      - name: Download linux host runtime artifact
        uses: actions/download-artifact@v8
        with:
          name: linux_host_runtime_macos_${{ github.sha }}
          path: ${{ github.workspace }}/linux_host_runtime_artifact

      - name: Extract linux host runtime artifact on macOS arm64
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tools/slicer_linux_runtime_host/runtime"
          tar -xzf "$GITHUB_WORKSPACE/linux_host_runtime_artifact/linux_host_runtime_${{ github.sha }}.tar.gz" -C "$GITHUB_WORKSPACE/tools/slicer_linux_runtime_host/runtime"

      - name: Install mac tools
        shell: bash
        run: |
          brew install automake texinfo libtool nasm m4
          command -v nasm
          nasm -v
          m4_path="$(brew --prefix m4)/bin/m4"
          if [ ! -x "$m4_path" ]; then
            m4_path="$(brew --prefix m4)/bin/gm4"
          fi
          "$m4_path" --gnu --version
          echo "M4=$m4_path" >> "$GITHUB_ENV"
          echo "$(dirname "$m4_path")" >> "$GITHUB_PATH"
          brew list
          mkdir -p "$GITHUB_WORKSPACE/deps/build/arm64"

      - name: Import macOS signing certificate
        if: ${{ env.BUILD_CERTIFICATE_BASE64 != '' && env.P12_PASSWORD != '' && env.KEYCHAIN_PASSWORD != '' && env.MACOS_CODESIGN_IDENTITY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/build_certificate.p12"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security import "$certificate_path" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Build macOS arm64 deps
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Build macOS arm64 deps attempt $attempt/3"
            if ./build_release_macos.sh -dx -1 -a arm64 -t 11.3; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Transient macOS dependency failure; removing empty downloads and retrying"
              find "$GITHUB_WORKSPACE/deps/DL_CACHE" -type f -size 0 -delete 2>/dev/null || true
              sleep $((attempt * 20))
            fi
          done
          exit 1

      - name: Build macOS arm64 app bundle
        shell: bash
        run: |
          ./build_release_macos.sh -s -n -x -1 -a arm64 -t 11.3

      - name: Create macOS arm64 DMG
        shell: bash
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/build/arm64/OrcaStudio/OrcaStudio.app"
          codesign --verify --deep --strict --verbose=4 "$app"
          spctl --assess --type execute --verbose=4 "$app" || true
          stage="$RUNNER_TEMP/OrcaStudio_dmg_arm64"
          rm -rf "$stage"
          mkdir -p "$stage"
          ditto "$app" "$stage/OrcaStudio.app"
          sign_identity="${MACOS_CODESIGN_IDENTITY:-}"
          if [ -z "$sign_identity" ]; then
            sign_identity="-"
          fi
          "$GITHUB_WORKSPACE/scripts/sign_macos_app.sh" \
            "$stage/OrcaStudio.app" \
            "$sign_identity" \
            "$GITHUB_WORKSPACE/scripts/disable_validation.entitlements"
          "$GITHUB_WORKSPACE/scripts/verify_macos_app_launch.sh" "$stage/OrcaStudio.app"
          stage_binary_sha="$(shasum -a 256 "$stage/OrcaStudio.app/Contents/MacOS/OrcaStudio" | awk '{print $1}')"
          ln -s /Applications "$stage/Applications"
          cp "$GITHUB_WORKSPACE/scripts/macos_first_launch.html" "$stage/00 - FIRST LAUNCH - OPEN ME.html"
          ver=$(sed -nE 's/^[[:space:]]*set\(SLIC3R_VERSION[[:space:]]+"([^"]+)".*/\1/p' version.inc | head -n1)
          if [ -z "$ver" ]; then
            echo "ERROR: SLIC3R_VERSION could not be resolved from version.inc"
            exit 1
          fi
          dmg="$GITHUB_WORKSPACE/OrcaStudio_Mac_arm64_V${ver}.dmg"
          tmp_dmg="$RUNNER_TEMP/OrcaStudio_Mac_arm64_V${ver}.tmp.dmg"
          volume="/Volumes/OrcaStudio-arm64"
          mount_dir="$RUNNER_TEMP/OrcaStudio_mounted_arm64"
          rm -f "$dmg" "$tmp_dmg"
          hdiutil detach "$volume" -force >/dev/null 2>&1 || true
          for attempt in 1 2 3; do
            echo "Creating macOS arm64 DMG (attempt $attempt/3)"
            if hdiutil create \
              -volname "OrcaStudio-arm64" \
              -srcfolder "$stage" \
              -fs HFS+ \
              -format UDZO \
              -ov \
              "$tmp_dmg"; then
              mv -f "$tmp_dmg" "$dmg"
              break
            fi
            rm -f "$tmp_dmg"
            hdiutil detach "$volume" -force >/dev/null 2>&1 || true
            sync
            sleep $((attempt * 5))
          done
          test -s "$dmg"
          hdiutil verify "$dmg"

          rm -rf "$mount_dir"
          mkdir -p "$mount_dir"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg"
          mounted_app="$mount_dir/OrcaStudio.app"
          test -f "$mount_dir/00 - FIRST LAUNCH - OPEN ME.html"
          cleanup_mounted_dmg() {
            hdiutil detach "$mount_dir" -force >/dev/null 2>&1 || true
            rm -rf "$mount_dir"
          }
          trap cleanup_mounted_dmg EXIT
          "$GITHUB_WORKSPACE/scripts/verify_macos_app_launch.sh" "$mounted_app"
          mounted_binary_sha="$(shasum -a 256 "$mounted_app/Contents/MacOS/OrcaStudio" | awk '{print $1}')"
          if [ "$mounted_binary_sha" != "$stage_binary_sha" ]; then
            echo "ERROR: OrcaStudio executable changed while creating the DMG" >&2
            exit 1
          fi
          cleanup_mounted_dmg
          trap - EXIT
          rm -rf "$stage"

          if [ -n "${MACOS_CODESIGN_IDENTITY:-}" ] && [ -n "${APPLE_DEV_ACCOUNT:-}" ] && [ -n "${TEAM_ID:-}" ] && [ -n "${APP_PWD:-}" ]; then
            codesign --force --verbose --timestamp --sign "$MACOS_CODESIGN_IDENTITY" "$dmg"
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_DEV_ACCOUNT" --team-id "$TEAM_ID" --password "$APP_PWD" --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            spctl --assess --type open --verbose=4 "$dmg" || true
          else
            echo "No Apple Developer ID notarization secrets configured. Publishing ad-hoc signed macOS DMG."
            echo "Users may need Control-click -> Open or Privacy & Security -> Open Anyway on first launch."
          fi


      - name: Upload macOS arm64 DMG
        uses: actions/upload-artifact@v7
        with:
          name: OrcaStudio_Mac_arm64_${{ github.sha }}
          path: ${{ github.workspace }}/OrcaStudio_Mac_arm64_V*.dmg
          if-no-files-found: error

  build_macos_x86_64:
    name: Build macOS x86_64 (cross-compiled on Apple Silicon)
    runs-on: macos-15
    needs: prepare_slicer_linux_runtime
    env:
      ORCA_UPDATER_SIG_KEY: ${{ secrets.ORCA_UPDATER_SIG_KEY }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CERTIFICATE_ID }}
      APPLE_DEV_ACCOUNT: ${{ secrets.APPLE_DEV_ACCOUNT }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      APP_PWD: ${{ secrets.APP_PWD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: 'false'

      - name: Normalize script permissions
        shell: bash
        run: |
          set -euo pipefail
          find "$GITHUB_WORKSPACE" -type f \( -name "*.sh" -o -name "*.command" \) -exec chmod +x {} +
          chmod +x "$GITHUB_WORKSPACE/build_release_macos.sh"
          chmod +x "$GITHUB_WORKSPACE/build_linux.sh"


      - name: Verify macOS packaging invariants
        shell: bash
        run: |
          set -euo pipefail
          bash -n build_release_macos.sh

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.3.0"
          useLocalCache: true
          useCloudCache: true

      - name: Download linux host runtime artifact
        uses: actions/download-artifact@v8
        with:
          name: linux_host_runtime_macos_${{ github.sha }}
          path: ${{ github.workspace }}/linux_host_runtime_artifact

      - name: Extract linux host runtime artifact on macOS x86_64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/tools/slicer_linux_runtime_host/runtime"
          tar -xzf "$GITHUB_WORKSPACE/linux_host_runtime_artifact/linux_host_runtime_${{ github.sha }}.tar.gz" -C "$GITHUB_WORKSPACE/tools/slicer_linux_runtime_host/runtime"

      - name: Install mac tools
        shell: bash
        run: |
          set -euo pipefail
          brew install automake texinfo libtool nasm m4
          command -v nasm
          nasm -v
          m4_path="$(brew --prefix m4)/bin/m4"
          if [ ! -x "$m4_path" ]; then
            m4_path="$(brew --prefix m4)/bin/gm4"
          fi
          "$m4_path" --gnu --version
          echo "M4=$m4_path" >> "$GITHUB_ENV"
          echo "$(dirname "$m4_path")" >> "$GITHUB_PATH"
          brew list
          mkdir -p "$GITHUB_WORKSPACE/deps/build/x86_64"

      - name: Verify macOS x86_64 cross-compilation host
        shell: bash
        run: |
          set -euo pipefail
          host_arch="$(uname -m)"
          if [[ "$host_arch" != "arm64" ]]; then
            echo "ERROR: x86_64 build must run as a cross-compilation on the macos-15 Apple Silicon runner; host is $host_arch" >&2
            exit 1
          fi
          echo "Cross-compiling macOS x86_64 on Apple Silicon host: $host_arch"

      - name: Import macOS signing certificate
        if: ${{ env.BUILD_CERTIFICATE_BASE64 != '' && env.P12_PASSWORD != '' && env.KEYCHAIN_PASSWORD != '' && env.MACOS_CODESIGN_IDENTITY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/build_certificate.p12"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security import "$certificate_path" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Build macOS x86_64 deps
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Build macOS x86_64 deps attempt $attempt/3"
            if ./build_release_macos.sh -dx -1 -a x86_64 -t 11.3; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Transient macOS dependency failure; removing empty downloads and retrying"
              find "$GITHUB_WORKSPACE/deps/DL_CACHE" -type f -size 0 -delete 2>/dev/null || true
              sleep $((attempt * 20))
            fi
          done
          exit 1

      - name: Build macOS x86_64 app bundle
        shell: bash
        run: |
          set -euo pipefail
          ./build_release_macos.sh -s -n -x -1 -a x86_64 -t 11.3

      - name: Verify macOS x86_64 binary architecture
        shell: bash
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/build/x86_64/OrcaStudio/OrcaStudio.app/Contents/MacOS/OrcaStudio"
          test -x "$binary"
          architectures="$(lipo -archs "$binary")"
          if [[ " $architectures " != *" x86_64 "* || " $architectures " == *" arm64 "* ]]; then
            echo "ERROR: expected an x86_64-only macOS executable, got: $architectures" >&2
            exit 1
          fi
          echo "Verified macOS executable architecture: $architectures"

      - name: Create macOS x86_64 DMG
        shell: bash
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/build/x86_64/OrcaStudio/OrcaStudio.app"
          codesign --verify --deep --strict --verbose=4 "$app"
          spctl --assess --type execute --verbose=4 "$app" || true
          stage="$RUNNER_TEMP/OrcaStudio_dmg_x86_64"
          rm -rf "$stage"
          mkdir -p "$stage"
          ditto "$app" "$stage/OrcaStudio.app"
          sign_identity="${MACOS_CODESIGN_IDENTITY:-}"
          if [ -z "$sign_identity" ]; then
            sign_identity="-"
          fi
          "$GITHUB_WORKSPACE/scripts/sign_macos_app.sh" \
            "$stage/OrcaStudio.app" \
            "$sign_identity" \
            "$GITHUB_WORKSPACE/scripts/disable_validation.entitlements"
          "$GITHUB_WORKSPACE/scripts/verify_macos_app_launch.sh" "$stage/OrcaStudio.app"
          stage_binary_sha="$(shasum -a 256 "$stage/OrcaStudio.app/Contents/MacOS/OrcaStudio" | awk '{print $1}')"
          ln -s /Applications "$stage/Applications"
          cp "$GITHUB_WORKSPACE/scripts/macos_first_launch.html" "$stage/00 - FIRST LAUNCH - OPEN ME.html"
          ver=$(sed -nE 's/^[[:space:]]*set\(SLIC3R_VERSION[[:space:]]+"([^"]+)".*/\1/p' version.inc | head -n1)
          if [ -z "$ver" ]; then
            echo "ERROR: SLIC3R_VERSION could not be resolved from version.inc"
            exit 1
          fi
          dmg="$GITHUB_WORKSPACE/OrcaStudio_Mac_x86_64_V${ver}.dmg"
          tmp_dmg="$RUNNER_TEMP/OrcaStudio_Mac_x86_64_V${ver}.tmp.dmg"
          volume="/Volumes/OrcaStudio-x86_64"
          mount_dir="$RUNNER_TEMP/OrcaStudio_mounted_x86_64"
          rm -f "$dmg" "$tmp_dmg"
          hdiutil detach "$volume" -force >/dev/null 2>&1 || true
          for attempt in 1 2 3; do
            echo "Creating macOS x86_64 DMG (attempt $attempt/3)"
            if hdiutil create \
              -volname "OrcaStudio-x86_64" \
              -srcfolder "$stage" \
              -fs HFS+ \
              -format UDZO \
              -ov \
              "$tmp_dmg"; then
              mv -f "$tmp_dmg" "$dmg"
              break
            fi
            rm -f "$tmp_dmg"
            hdiutil detach "$volume" -force >/dev/null 2>&1 || true
            sync
            sleep $((attempt * 5))
          done
          test -s "$dmg"
          hdiutil verify "$dmg"

          rm -rf "$mount_dir"
          mkdir -p "$mount_dir"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg"
          mounted_app="$mount_dir/OrcaStudio.app"
          test -f "$mount_dir/00 - FIRST LAUNCH - OPEN ME.html"
          cleanup_mounted_dmg() {
            hdiutil detach "$mount_dir" -force >/dev/null 2>&1 || true
            rm -rf "$mount_dir"
          }
          trap cleanup_mounted_dmg EXIT
          "$GITHUB_WORKSPACE/scripts/verify_macos_app_launch.sh" "$mounted_app"
          mounted_binary_sha="$(shasum -a 256 "$mounted_app/Contents/MacOS/OrcaStudio" | awk '{print $1}')"
          if [ "$mounted_binary_sha" != "$stage_binary_sha" ]; then
            echo "ERROR: OrcaStudio executable changed while creating the DMG" >&2
            exit 1
          fi
          cleanup_mounted_dmg
          trap - EXIT
          rm -rf "$stage"

          if [ -n "${MACOS_CODESIGN_IDENTITY:-}" ] && [ -n "${APPLE_DEV_ACCOUNT:-}" ] && [ -n "${TEAM_ID:-}" ] && [ -n "${APP_PWD:-}" ]; then
            codesign --force --verbose --timestamp --sign "$MACOS_CODESIGN_IDENTITY" "$dmg"
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_DEV_ACCOUNT" --team-id "$TEAM_ID" --password "$APP_PWD" --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            spctl --assess --type open --verbose=4 "$dmg" || true
          else
            echo "No Apple Developer ID notarization secrets configured. Publishing ad-hoc signed macOS DMG."
            echo "Users may need Control-click -> Open or Privacy & Security -> Open Anyway on first launch."
          fi


      - name: Upload macOS x86_64 DMG
        uses: actions/upload-artifact@v7
        with:
          name: OrcaStudio_Mac_x86_64_${{ github.sha }}
          path: ${{ github.workspace }}/OrcaStudio_Mac_x86_64_V*.dmg
          if-no-files-found: error

